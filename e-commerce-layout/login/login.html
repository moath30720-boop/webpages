<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div>
        <h1>Login</h1>
        <form action="../landing-page/landing-page.html" method="GET">
            <label for="username">Full name:</label>
            <input type="text" id="username" name="username" required placeholder="e.g. muhammed ahmed">
            <br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required placeholder="e.g. muhammed@example.com">
            <br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <br>
            <label for="confirm-password">Confirm Password:</label>
            <input type="password" id="confirm-password" name="confirm-password" required>
            <br>
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone" required placeholder="e.g. 123-456-7890">
            <br>
            <label for="address">Address:</label>
            <input type="text" id="address" name="address" required placeholder="e.g. 123 Main St, City, Country">
            <br>
            <button type="submit">Register</button>
        </form>
    </div>
</body>
</html>
